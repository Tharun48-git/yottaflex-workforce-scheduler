[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yottaflex-workforce-scheduler"
version = "1.0.0"
description = "Deterministic synthetic workforce scheduling, validation, and anomaly reporting demo"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
workforce-scheduler = "workforce_scheduler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
